# Eventos activos a la vez (event_id de master/event_config.json).
#
# El servidor los deja activos desde ayer hasta dentro de 30 días: sus fechas, su tienda de canje,
# sus misiones y su banner de portada (este va el primero del carrusel, sin ponerlo en
# home-banners.toml). En el juego original solían coincidir 2 o 3. Tras cambiarlo, reinicia el
# servidor.
#
# Solo 5 eventos conservan su pantalla en el cliente (BackgroundEventTop<id> en el catálogo de
# recursos); con cualquier otro, al abrirlo sale «Data Load Failed» (probado con 23111):
#   24011  Etiquette for This New Year's Party!        (historia con jefe y canje; probado)
#   24041  A Service For This Forbidden Weakest Adventurer! (probado; sin banner ni cartel de canje
#          en los recursos descargados, salen en blanco)
#   24013  Elite Bounty Hunt! ~Giant Bat~               (tipo 1 sin canje; sin probar)
#   24012  Troll Attack ~Risky Business~                (tipo 2, jefe en grupo; sin probar)
#   23121  Christmas on This Street of Royal Capital!  (tipo 2, jefe en grupo; sin probar)
ids = [
  24011, # Etiquette for This New Year's Party!
  24041, # A Service For This Forbidden Weakest Adventurer!
]
