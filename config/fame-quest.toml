# Poder de equipo que piden las Fame Quests, en % del original (100 = como en el juego).
#
# El juego no deja pulsar «Begin» por debajo de ese poder. En el original la fase más fácil pide
# 12.000 y las demás 15.000 o más. Al 80 %: 9.600 y 12.000. Tras cambiarlo, reinicia el servidor
# (el juego vuelve a descargar los datos si cambian).
required_power_percent = 100

# Mandar al juego el rasgo de fama puesto en cada formación. Con un rasgo puesto, Team → Party se
# quedaba en «Now Loading» para siempre (27/11), así que va apagado; el rasgo se guarda igual.
send_party_traits = false

# Cómo van las estadísticas añadidas de cada rasgo (para probar qué espera el juego):
#   "stat" (un rango de una estadística), "pa_skill" (solo una entrada de tipo 99),
#   "pa_skill_first" o "stat_first" (las dos).
trait_status = "stat"

# Rango de fama mínimo de la cuenta. El rango sube al superar la misión que pide cada rango
# (maestro fame_rank: 710021 da el 2, 720041 el 3, ... 760111 el 7), pero nunca baja de este.
# Antes era un 5 fijo, así que se deja en 5 para no cerrar nada que ya estuviera abierto.
min_fame_rank = 5
